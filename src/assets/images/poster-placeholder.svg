<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle border pattern -->
  <rect x="20" y="20" width="360" height="560" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  
  <!-- Film Roll Center Graphic -->
  <g transform="translate(140, 200)">
    <circle cx="60" cy="60" r="54" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="60" cy="60" r="16" fill="#0b0f17" stroke="#475569" stroke-width="2"/>
    <circle cx="60" cy="24" r="7" fill="#f59e0b"/>
    <circle cx="60" cy="96" r="7" fill="#f59e0b"/>
    <circle cx="24" cy="60" r="7" fill="#f59e0b"/>
    <circle cx="96" cy="60" r="7" fill="#f59e0b"/>
  </g>
  
  <text x="200" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="1">FREEFLIX ARCHIVE</text>
  <text x="200" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">Legal Public Domain Film</text>
  <text x="200" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#64748b">No Poster Available</text>
</svg>
